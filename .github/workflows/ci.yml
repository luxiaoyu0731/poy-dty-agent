name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-review:
    name: Security review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned Python security tools
        run: python -m pip install --disable-pip-version-check semgrep==1.171.0 pre-commit==4.3.0

      - name: Run Semgrep ERROR-severity gate
        id: semgrep
        continue-on-error: true
        run: semgrep scan --config .semgrep/semgrep.yml --severity ERROR --error --sarif-output semgrep.sarif .

      - name: Set up Go for pinned Gitleaks
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run pre-commit hooks
        id: precommit
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            pre-commit run --all-files
          else
            pre-commit run --from-ref "$base_sha" --to-ref "$GITHUB_SHA"
          fi

      - name: Run Gitleaks history scan
        id: gitleaks
        continue-on-error: true
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

      - name: Run Trivy HIGH/CRITICAL dependency and IaC gate
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "1"

      - name: Preserve security reports for PR feedback
        if: always() && (hashFiles('semgrep.sarif') != '' || hashFiles('trivy.sarif') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-sarif
          path: |
            semgrep.sarif
            trivy.sarif
          retention-days: 7

      - name: Enforce security review gate
        if: always()
        env:
          PRECOMMIT_OUTCOME: ${{ steps.precommit.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          for outcome in "$PRECOMMIT_OUTCOME" "$SEMGREP_OUTCOME" "$GITLEAKS_OUTCOME" "$TRIVY_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "Security review failed. Inspect the preceding scanner output."
              exit 1
            fi
          done

  reviewdog:
    name: Security PR feedback
    # Forked pull requests receive a read-only token. Keep their security scan
    # blocking, but do not attempt to publish annotations with unavailable rights.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: security-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Semgrep report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-sarif

      - name: Set up pinned reviewdog
        if: steps.download.outcome == 'success'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.20.3

      - name: Publish Semgrep annotations
        if: steps.download.outcome == 'success' && hashFiles('semgrep.sarif') != ''
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewdog -f=sarif -name=semgrep -reporter=github-pr-check -fail-level=none < semgrep.sarif

      - name: Publish Trivy annotations
        if: steps.download.outcome == 'success' && hashFiles('trivy.sarif') != ''
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewdog -f=sarif -name=trivy -reporter=github-pr-check -fail-level=none < trivy.sarif

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Prepare isolated frontend test root
        run: |
          test_root="$RUNNER_TEMP/dg01-frontend"
          install -d -m 700 "$test_root" "$test_root/tmp"
          echo "DG01_TEST_DB_ROOT=$test_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$test_root/tmp" >> "$GITHUB_ENV"
          echo "SQLITE_PATH=$test_root/bootstrap.db" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/server" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm audit --registry=https://registry.npmjs.org --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Public login browser and authentication regression
        run: node --test scripts/tests/demo-setup.test.mjs tests/public-login-browser.test.mjs tests/public-password-auth.test.mjs tests/public-password-auth-integration.test.mjs tests/public-proxy-response.test.mjs tests/local-public-server-entrypoint.test.mjs tests/public-bare-apex-redirect.test.mjs
      - run: npm run test:e2e
      - run: npm run visual:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-test-artifacts
          path: |
            playwright-report/
            test-results/
            .visual-regression/latest/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Prepare isolated backend test root
        run: |
          test_root="$RUNNER_TEMP/dg01-backend"
          install -d -m 700 "$test_root" "$test_root/tmp"
          echo "DG01_TEST_DB_ROOT=$test_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$test_root/tmp" >> "$GITHUB_ENV"
          echo "SQLITE_PATH=$test_root/bootstrap.db" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/server" >> "$GITHUB_ENV"
          echo "COVERAGE_FILE=$test_root/.coverage" >> "$GITHUB_ENV"
      - run: uv sync --frozen --all-groups
        working-directory: server
      - run: uv run ruff check .
        working-directory: server
      - run: uv run pytest tests --cov=app --cov-report=term-missing --cov-fail-under=70
        working-directory: server
      - run: uv run pip-audit
        working-directory: server
      - run: uv run python ../scripts/run-ai-evals.py
        working-directory: server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-artifacts
          path: ${{ runner.temp }}/dg01-backend/.coverage

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          output: results
          upload: never
          upload-database: false
      - name: Enforce CodeQL findings gate
        run: |
          jq -s '[.[].runs[]?.results[]?]' results/*.sarif > findings.json
          result_count="$(jq 'length' findings.json)"
          echo "CodeQL findings: $result_count"
          # Waivers are bidirectional: a new finding, a stale waiver, a duplicate,
          # an expired waiver, or incomplete review metadata all fail the gate.
          today="$(date -u +%F)"
          waiver_audit="$(jq -n --arg today "$today" \
            --slurpfile waivers .github/codeql-waivers.json \
            --slurpfile findings findings.json '
            ( [ $waivers[0].waivers[] | [.ruleId, .path, .startLine] ] ) as $waived
            | ( [ $findings[0][]
                  | [.ruleId,
                     .locations[0].physicalLocation.artifactLocation.uri,
                     .locations[0].physicalLocation.region.startLine] ] | unique ) as $found
            | {
                unwaived: ([ $found[] | . as $t | select(any($waived[]; . == $t) | not) ] | length),
                stale: ([ $waived[] | . as $t | select(any($found[]; . == $t) | not) ] | length),
                duplicate: (($waived | length) - ($waived | unique | length)),
                invalid_metadata: ([ $waivers[0].waivers[]
                  | select(
                      (.owner | type) != "string" or (.owner | length) == 0 or
                      (.reason | type) != "string" or (.reason | length) < 20 or
                      (.expires_at | type) != "string" or .expires_at < $today
                    ) ] | length)
              }')"
          echo "CodeQL waiver audit: $waiver_audit"
          test "$(jq '.unwaived' <<<"$waiver_audit")" -eq 0
          test "$(jq '.stale' <<<"$waiver_audit")" -eq 0
          test "$(jq '.duplicate' <<<"$waiver_audit")" -eq 0
          test "$(jq '.invalid_metadata' <<<"$waiver_audit")" -eq 0
      - name: Preserve CodeQL reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: results/
          retention-days: 7

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python scripts/test-release.py
