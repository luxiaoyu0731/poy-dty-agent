  /api/v1/forecasts/seven-product/evidence:
    get:
      summary: Seven Product Evidence
      description: Read business evidence; current preview never modifies an issued forecast.
      operationId: seven_product_evidence_api_v1_forecasts_seven_product_evidence_get
      parameters:
      - name: target
        in: query
        required: false
        schema:
          enum:
          - crude
          - naphtha
          - px
          - pta
          - meg
          - poy
          - dty
          type: string
          default: poy
          title: Target
      - name: horizon_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          enum:
          - 1
          - 7
          - 30
          default: 1
          title: Horizon Days
      - name: view
        in: query
        required: false
        schema:
          enum:
          - issued
          - current
          type: string
          default: issued
          title: View
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: input_sha256
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Input Sha256
      - name: event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          title: Event Id
      - name: event_revision_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          title: Event Revision Id
      - name: report_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          title: Report Id
      - name: context_pack_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          title: Context Pack Id
      - name: batch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          title: Batch Id
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          description: Force a new current-data capture instead of the cached snapshot
          default: false
          title: Refresh
        description: Force a new current-data capture instead of the cached snapshot
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDossierResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
