              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/pipeline/graph:
    get:
      summary: Pipeline Graph
      description: 'One aggregated first-paint payload for the 18-node mixed pipeline graph.


        Pure read over the normalized state layer (DESIGN §2.7): status files,

        output freshness, worker heartbeats, snapshot/batch tables and LLM-trace

        cost aggregations. The drawer payload is lazy-loaded per node via

        ``/pipeline/nodes/{node_id}``.'
      operationId: pipeline_graph_api_v1_pipeline_graph_get
      parameters:
      - name: business_date
        in: query
