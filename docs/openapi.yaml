        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Poy Dty Local Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineGraphEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pipeline/nodes/{node_id}:
    get:
      summary: Pipeline Node Detail
      description: 'Drawer payload for one node: four blocks plus agent-only extras.

        Agent nodes carry a normalized daily_cost block: native_amount_micros/

        native_currency keep the authoritative ledger value, display_amount_micros/

        display_currency="CNY" fold USD to CNY with the versioned static anchor

        (fx_rate, fx_version, e.g. usd-cny-static-2026-09@7.25); budget

        enforcement still settles natively in micro-USD.

        Four chain-stage nodes optionally include implementation_profile: basis, source,

        prompt_version, system_prompt, prompt_sha256, configured_model, model_source,

        stage_cap, context, tools, output, fallback, historical_request. This is current

        service code configuration, not a historical request snapshot. Other nodes omit

        this block. No credentials, endpoint addresses or user request bodies are exposed.'
      operationId: pipeline_node_detail_api_v1_pipeline_nodes__node_id__get
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      - name: business_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Date
      - name: x-internal-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      - name: poy_dty_local_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Poy Dty Local Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Pipeline Node Detail Api V1 Pipeline Nodes  Node Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
