            application/json:
              schema:
                $ref: '#/components/schemas/StoredPredictionRecord'
        '401':
          description: Internal authentication required
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Trusted request-bound formal series eligibility proof is unavailable.
        '422':
          description: Request validation failed
          headers:
