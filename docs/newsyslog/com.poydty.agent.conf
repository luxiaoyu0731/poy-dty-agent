# newsyslog sample for the POY/DTY Agent macOS runtime.
#
# Install (one-time, per host):
#   1. Copy this file to /etc/newsyslog.d/com.poydty.agent.conf
#      and replace the HOME placeholder with the real home path:
#        sed "s|HOME|$(printf '%s' "$HOME" | sed 's/[&|]/\\&/g')|g" \
#          docs/newsyslog/com.poydty.agent.conf \
#          | sudo tee /etc/newsyslog.d/com.poydty.agent.conf > /dev/null
#   2. Dry-run to verify the rules match: sudo newsyslog -nvv
# Rotation happens when any log exceeds 10 MB; 3 compressed archives are kept.
#
# logfilename                                                    [owner:group] mode count size when flags
"HOME/Library/Application Support/POY-DTY-Agent/shared/logs/*.log"               644 3 10240 * J
"HOME/.codex-run/local-services/logs/*.log"                                      644 3 10240 * J
